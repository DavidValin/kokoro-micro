[package]
name = "kokoro-micro"
version = "1.3.0"
edition = "2021"
authors = ["Hue & Aye <team@8b.is>", "David Valin <hola@davidvalin.com>", "mik-tf"]
description = "Minimal TTS crate using Kokoro - perfect for embedding in other apps"
license = "Apache-2.0"
homepage = "https://github.com/DavidValin/kokoro-micro"
repository = "https://github.com/DavidValin/kokoro-micro"
documentation = "https://docs.rs/kokoro-micro"
readme = "README.md"
keywords = ["tts", "text-to-speech", "kokoro", "audio", "voice"]
categories = ["multimedia::audio", "multimedia"]
exclude = ["*.wav", "*.mp3", "*.opus", "*.flac", "target/", ".git/", ".DS_Store", "0.onnx", "0.bin", "models/"]
include = [
    "src/**/*", "Cargo.toml", "LICENSE", "NOTICE", "README.md",
    "examples/**/*", "assets/fallback.wav",
    # Generators for the committed language tables, so the crate on crates.io
    # is reproducible from its own sources.
    "tools/README.md", "tools/gen_zh_data.py", "tools/gen_ja_data.py",
    "tools/gen_en_data.py", "tools/kokoro_vocab.json",
]

[dependencies]
# Core ONNX Runtime for model inference
ort = { version = "2.0.0-rc.11", features = ["ndarray"] }

# Essential for text processing and audio
hound = "3.5.1"  # WAV support built-in
ndarray = "0.17.2"
ndarray-npy = "0.10.0"


# Mandarin: word segmentation and character readings.
jieba-rs = "0.10"
pinyin = "0.11"

# Japanese: OpenJTalk's text processor, rewritten in Rust.
jpreprocess = { version = "0.15", features = ["naist-jdic"] }

# Minimal async support for downloading model
tokio = { version = "1.45", features = ["fs", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[features]
default = []
cuda = ["ort/cuda"]

[[example]]
name = "simple"

[dev-dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
